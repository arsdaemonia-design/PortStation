name: Multiplatform Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            bin_name: portstation-core.exe
            out_name: PortStation.exe
            archive_name: PortStation-windows-x64.zip
          - platform: linux-x86_64
            os: ubuntu-22.04
            bin_name: portstation-core
            out_name: PortStation
            archive_name: PortStation-linux-x86_64.tar.gz
          - platform: macos-arm64
            os: macos-latest
            bin_name: portstation-core
            out_name: PortStation
            archive_name: PortStation-macos-arm64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies (WebKitGTK 4.1)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint & Frontend Build
        run: |
          npm run lint
          npm run build

      - name: Run Rust Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Tauri Application (Embedded Frontend)
        run: npx tauri build

      - name: Package Windows Release Archive
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-pkg | Out-Null
          Copy-Item "src-tauri/target/release/${{ matrix.bin_name }}" "dist-pkg/${{ matrix.out_name }}" -Force
          if (Test-Path "README.md") { Copy-Item "README.md" "dist-pkg/README.md" -Force }
          Compress-Archive -Path "dist-pkg/*" -DestinationPath "${{ matrix.archive_name }}" -Force

      - name: Package Unix Release Archive (Linux / macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist-pkg
          cp "src-tauri/target/release/${{ matrix.bin_name }}" "dist-pkg/${{ matrix.out_name }}"
          chmod +x "dist-pkg/${{ matrix.out_name }}"
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            codesign --force --deep --sign - "dist-pkg/${{ matrix.out_name }}" || true
          fi
          if [ -f "README.md" ]; then cp "README.md" "dist-pkg/README.md"; fi
          tar -czvf "${{ matrix.archive_name }}" -C dist-pkg .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

      - name: Attach to GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
          generate_release_notes: true

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pre-installed Android SDK & NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Setup Rust with Android ARM64 Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache (Android)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android-arm64

      - name: Install Frontend Dependencies & Build Dist
        run: |
          npm ci
          npm run build

      - name: Initialize & Build Tauri Android APK (ARM64)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci --skip-targets-install
          fi
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "QUERY_ALL_PACKAGES" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <application|' "$MANIFEST"
          fi
          MAIN_ACTIVITY=$(find src-tauri/gen/android/app/src/main/java -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            PKG_LINE=$(grep "^package " "$MAIN_ACTIVITY" | head -n 1)
            echo "$PKG_LINE" > "$MAIN_ACTIVITY"
            cat << 'EOF' >> "$MAIN_ACTIVITY"

import android.annotation.SuppressLint
import android.app.DownloadManager
import android.content.Context
import android.content.Intent
import android.content.pm.ApplicationInfo
import android.net.Uri
import android.os.Bundle
import android.os.Environment
import android.webkit.JavascriptInterface
import android.webkit.URLUtil
import android.webkit.WebView
import androidx.activity.enableEdgeToEdge

class MainActivity : TauriActivity() {
  override fun onCreate(savedInstanceState: Bundle?) {
    enableEdgeToEdge()
    super.onCreate(savedInstanceState)
  }

  @SuppressLint("JavascriptInterface")
  override fun onWebViewCreate(webView: WebView) {
    super.onWebViewCreate(webView)
    val bridge = PortStationBridge(this)
    webView.addJavascriptInterface(bridge, "PortStationAndroid")
    webView.setDownloadListener { url, _, contentDisposition, mimeType, _ ->
      val guessedName = URLUtil.guessFileName(url, contentDisposition, mimeType) ?: "portstation-package.apk"
      bridge.downloadFile(url, guessedName)
    }
  }
}

class PortStationBridge(private val activity: MainActivity) {
  @JavascriptInterface
  fun downloadFile(url: String, fileName: String): String {
    return try {
      val safeName = fileName.replace(Regex("[^a-zA-Z0-9._-]"), "_").ifEmpty { "portstation-package.apk" }
      val dm = activity.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
      val request = DownloadManager.Request(Uri.parse(url))
        .setTitle(safeName)
        .setDescription("Descargando paquete desde PortStation")
        .addRequestHeader("User-Agent", "Mozilla/5.0 (Linux; Android 14) PortStation/0.1.1")
        .addRequestHeader("Accept", "application/octet-stream, */*")
        .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
        .setAllowedOverMetered(true)
        .setAllowedOverRoaming(true)
        .setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, safeName)
      if (safeName.lowercase().endsWith(".apk")) {
        request.setMimeType("application/vnd.android.package-archive")
      }
      val id = dm.enqueue(request)
      "OK:$id"
    } catch (e: Exception) {
      try {
        val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url)).apply {
          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
        }
        activity.startActivity(intent)
        "BROWSER"
      } catch (e2: Exception) {
        "ERROR:${e.message}"
      }
    }
  }

  @JavascriptInterface
  fun openExternalUrl(url: String): Boolean {
    return try {
      val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url)).apply {
        addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
      }
      activity.startActivity(intent)
      true
    } catch (_: Exception) {
      false
    }
  }

  @JavascriptInterface
  fun openDownloads(): Boolean {
    return try {
      val intent = Intent(DownloadManager.ACTION_VIEW_DOWNLOADS).apply {
        addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
      }
      activity.startActivity(intent)
      true
    } catch (_: Exception) {
      false
    }
  }

  @JavascriptInterface
  fun getInstalledPackages(): String {
    return try {
      val pm = activity.packageManager
      val apps = pm.getInstalledApplications(0)
      apps.mapNotNull { info ->
        val isSystem = (info.flags and ApplicationInfo.FLAG_SYSTEM) != 0 &&
          (info.flags and ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) == 0
        if (!isSystem && info.packageName != activity.packageName) {
          val label = try {
            pm.getApplicationLabel(info).toString().replace("\n", " ").replace("|", " ")
          } catch (_: Exception) {
            ""
          }
          "${info.packageName}|$label"
        } else {
          null
        }
      }.joinToString("\n")
    } catch (_: Exception) {
      ""
    }
  }

  @JavascriptInterface
  fun launchPackage(packageName: String): Boolean {
    return try {
      val cleanPkg = packageName.trim().removePrefix("package:")
      val intent = activity.packageManager.getLaunchIntentForPackage(cleanPkg)
      if (intent != null) {
        intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
        activity.startActivity(intent)
        true
      } else {
        false
      }
    } catch (_: Exception) {
      false
    }
  }
}
EOF
          fi
          npx tauri android build --apk --target aarch64 --ci

      - name: Sign & Package Installable Android APK
        run: |
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $UNSIGNED_APK"
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          if [[ "$UNSIGNED_APK" == *"unsigned"* ]]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" aligned.apk
            "$BUILD_TOOLS_DIR/apksigner" sign --ks debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out PortStation-android-arm64.apk aligned.apk
          else
            cp "$UNSIGNED_APK" PortStation-android-arm64.apk
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortStation-android-arm64.apk
          path: PortStation-android-arm64.apk

      - name: Attach Android APK to GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PortStation-android-arm64.apk
          generate_release_notes: true
