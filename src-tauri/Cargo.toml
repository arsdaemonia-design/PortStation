[package]
name = "portstation-core"
version = "0.1.0"
description = "PortStation local-first port launcher and fingerprint engine"
authors = ["PortStation Contributors"]
edition = "2021"

[lib]
name = "portstation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
thiserror = "2"
ureq = "2.10"
semver = "1"

[dev-dependencies]
tempfile = "3"
